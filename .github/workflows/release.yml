name: Build WordPress release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          PLUGIN_VERSION="$(sed -n 's/^ \* Version: //p' tinker-valley-import-export.php | head -1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PLUGIN_VERSION" = "$TAG_VERSION"

      - name: Build installable plugin
        run: |
          mkdir -p staging/tinker-valley-import-export
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='staging' \
            --exclude='*.zip' \
            ./ staging/tinker-valley-import-export/
          cd staging
          zip -qr ../tinker-valley-import-export.zip tinker-valley-import-export

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            tinker-valley-import-export.zip \
            --title "Tinker Valley Import & Export ${GITHUB_REF_NAME#v}" \
            --generate-notes
